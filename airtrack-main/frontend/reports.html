<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports | AirTrack</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="mock-banner" hidden></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark">A</span><span>AirTrack</span><span class="brand-sub">Delhi air quality</span></a>
      <nav class="nav">
        <a href="index.html">Dashboard</a>
        <a href="summary.html">24-Hour Summary</a>
        <a href="search.html">Search</a>
        <a href="reports.html">Reports</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Reports</h1>
        <p class="page-subtitle">Compare stations and analyse AQI trends over time.</p>
      </div>
    </div>

    <div id="loading" hidden><div class="loading"><span class="spinner"></span>Loading…</div></div>
    <div id="message" class="notice" hidden></div>

    <section class="card">
      <div class="card-head"><h2 class="card-title">Compare stations</h2></div>
      <div class="card-body">
        <form id="compare-form">
          <div class="form-row">
            <div class="field">
              <label for="compare-date">Date <small style="text-transform:none;font-weight:400;color:var(--text-subtle);">(leave empty for latest)</small></label>
              <input id="compare-date" type="date" class="input" />
            </div>
            <div class="field" style="justify-content:flex-end;">
              <label>&nbsp;</label>
              <button type="submit" class="btn btn-primary">Show report</button>
            </div>
          </div>
        </form>
        <div id="compare-loading" hidden><div class="loading"><span class="spinner"></span>Loading…</div></div>
        <div id="compare-result" style="margin-top:16px;"></div>
      </div>
    </section>

    <section class="card" style="margin-top:16px;">
      <div class="card-head"><h2 class="card-title">Average AQI trend</h2></div>
      <div class="card-body">
        <form id="trend-form">
          <div class="form-row">
            <div class="field">
              <label for="trend-station">Station</label>
              <select id="trend-station" class="select"><option value="">Loading…</option></select>
            </div>
            <div class="field">
              <label for="trend-period">Period</label>
              <select id="trend-period" class="select">
                <option value="daily">Daily</option>
                <option value="monthly">Monthly</option>
              </select>
            </div>
            <div class="field" style="justify-content:flex-end;">
              <label>&nbsp;</label>
              <button type="submit" class="btn btn-primary">Show trend</button>
            </div>
          </div>
        </form>
        <div id="trend-loading" hidden><div class="loading"><span class="spinner"></span>Loading…</div></div>
        <div class="chart-container" id="trend-chart" style="margin-top:16px; height: 300px;"></div>
      </div>
    </section>
  </main>

  <footer class="footer">AirTrack · DBMS project, NIT Delhi (CSE)</footer>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
