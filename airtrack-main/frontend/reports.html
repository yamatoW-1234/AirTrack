<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports | AirTrack</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">A</span>
        <span>AirTrack</span>
        <span class="brand-sub">Delhi air quality</span>
      </a>
      <nav class="nav">
        <a href="index.html">Dashboard</a>
        <a href="summary.html">24-Hour Summary</a>
        <a href="search.html">Search</a>
        <a href="reports.html">Reports</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Reports</h1>
        <p class="page-subtitle">Compare stations and analyse AQI trends over time.</p>
      </div>
    </div>

    <section class="card" style="margin-bottom:16px;">
      <div class="card-head"><h2 class="card-title">Compare stations</h2></div>
      <div class="card-body">
        <div class="form-row">
          <div class="field">
            <label for="cmp-date">Date <small style="text-transform:none;font-weight:400;color:var(--text-subtle);">(leave empty for latest day)</small></label>
            <input id="cmp-date" type="date" class="input" />
          </div>
          <div class="field" style="justify-content:flex-end;">
            <label>&nbsp;</label>
            <button id="cmp-show" class="btn btn-primary">Show report</button>
          </div>
        </div>

        <div id="cmp-result" style="margin-top:16px;">
          <div class="loading"><span class="spinner"></span>Loading…</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2 class="card-title">Average AQI trend</h2></div>
      <div class="card-body">
        <div class="form-row">
          <div class="field">
            <label for="tr-station">Station</label>
            <select id="tr-station" class="select"><option value="">Loading…</option></select>
          </div>
          <div class="field">
            <label for="tr-period">Period</label>
            <select id="tr-period" class="select">
              <option value="daily">Daily</option>
              <option value="monthly">Monthly</option>
            </select>
          </div>
          <div class="field" style="justify-content:flex-end;">
            <label>&nbsp;</label>
            <button id="tr-show" class="btn btn-primary">Show trend</button>
          </div>
        </div>

        <div id="tr-chart-host" style="margin-top:16px;">
          <div class="loading"><span class="spinner"></span>Loading…</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">AirTrack · DBMS project, NIT Delhi (CSE)</footer>

  <script src="js/app.js"></script>
  <script>
  (function () {
    const AT = window.AirTrack;
    const cmpDate = document.getElementById("cmp-date");
    const cmpShow = document.getElementById("cmp-show");
    const cmpResult = document.getElementById("cmp-result");

    const trStation = document.getElementById("tr-station");
    const trPeriod  = document.getElementById("tr-period");
    const trShow    = document.getElementById("tr-show");
    const trHost    = document.getElementById("tr-chart-host");

    async function loadCompare() {
      cmpResult.innerHTML = `<div class="loading"><span class="spinner"></span>Loading…</div>`;
      try {
        const q = {};
        if (cmpDate.value) q.date = cmpDate.value;
        const data = await AT.api("/api/reports/compare", { query: q });
        const rows = data.rows || [];
        if (!rows.length) {
          cmpResult.innerHTML = `<div class="empty">No data for the selected date.</div>`;
          return;
        }
        const worst = rows.reduce((a, b) => ((b.aqi || 0) > (a.aqi || 0) ? b : a), rows[0]);
        const head = `
          <div class="stat" style="margin-bottom:14px;">
            <div class="stat-label">Most polluted station</div>
            <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:6px;">
              <div style="font-size:20px; font-weight:700;">${escapeHtml(worst.stationName || worst.stationId)}</div>
              ${AT.aqiBadge(worst.aqi)}
              <div style="color:var(--text-muted); font-size:13px;">Dominant pollutant: <strong>${escapeHtml(worst.dominantPollutant || "—")}</strong></div>
            </div>
          </div>
        `;
        const table = `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Station</th><th>AQI</th><th>Category</th><th>Dominant pollutant</th></tr></thead>
              <tbody>
                ${rows.map(r => `
                  <tr>
                    <td><strong>${escapeHtml(r.stationName || r.stationId)}</strong></td>
                    <td>${r.aqi ?? "—"}</td>
                    <td>${AT.aqiBadge(r.aqi)}</td>
                    <td>${escapeHtml(r.dominantPollutant || "—")}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
        cmpResult.innerHTML = head + table;
      } catch (e) {
        cmpResult.innerHTML = `<div class="empty">Failed to load comparison.</div>`;
        AT.toast(e.message, "error");
      }
    }

    async function loadTrend() {
      const stationId = trStation.value;
      if (!stationId) { trHost.innerHTML = `<div class="empty">Select a station.</div>`; return; }
      trHost.innerHTML = `<div class="loading"><span class="spinner"></span>Loading…</div>`;
      try {
        const data = await AT.api(`/api/reports/trend`, {
          query: { station: stationId, period: trPeriod.value }
        });
        const points = (data.points || []).map((p, i) => ({ x: i, y: Number(p.value) || 0 }));
        if (!points.length) { trHost.innerHTML = `<div class="empty">No trend data available.</div>`; return; }
        const width = trHost.clientWidth || 700;
        const height = 260;
        const labels = data.points || [];
        const svg = `
          <svg class="chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" width="100%" height="${height}">
            ${AT.svgLine(points, width, height, "#2563eb")}
          </svg>
          <div class="chart-legend">
            <span><span class="swatch" style="background:#2563eb"></span>Average AQI</span>
            <span>${labels.length} point${labels.length === 1 ? "" : "s"} · ${trPeriod.value}</span>
          </div>
        `;
        trHost.innerHTML = svg;
      } catch (e) {
        trHost.innerHTML = `<div class="empty">Failed to load trend.</div>`;
        AT.toast(e.message, "error");
      }
    }

    async function loadStations() {
      try {
        const data = await AT.api("/api/stations");
        const list = Array.isArray(data) ? data : (data.stations || []);
        trStation.innerHTML = list.length
          ? list.map(s => `<option value="${s.id}">${escapeHtml(s.name || s.id)}</option>`).join("")
          : `<option value="">No stations</option>`;
        if (list.length) loadTrend();
        else trHost.innerHTML = `<div class="empty">No stations available.</div>`;
      } catch (e) {
        trStation.innerHTML = `<option value="">Failed to load</option>`;
        AT.toast(e.message, "error");
      }
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    cmpShow.addEventListener("click", loadCompare);
    trShow.addEventListener("click", loadTrend);
    trStation.addEventListener("change", loadTrend);
    trPeriod.addEventListener("change", loadTrend);

    loadStations();
    loadCompare();
  })();
  </script>
  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/common.js"></script><script src="js/reports.js"></script>
</body>
</html>
