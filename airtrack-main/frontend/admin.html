<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Station Management | AirTrack</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="mock-banner" hidden></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark">A</span><span>AirTrack</span><span class="brand-sub">Delhi air quality</span></a>
      <nav class="nav">
        <a href="index.html">Dashboard</a>
        <a href="summary.html">24-Hour Summary</a>
        <a href="search.html">Search</a>
        <a href="reports.html">Reports</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Station Management</h1>
        <p class="page-subtitle">Add or update monitoring stations and assign pollutants.</p>
      </div>
    </div>

    <div id="loading" hidden><div class="loading"><span class="spinner"></span>Loading…</div></div>
    <div id="admin-message" class="notice" hidden></div>

    <section class="card">
      <div class="card-head"><h2 class="card-title">Admin key</h2></div>
      <div class="card-body">
        <div class="form-row">
          <div class="field" style="grid-column: 1 / -1; max-width: 420px;">
            <label for="admin-key">X-Admin-Key</label>
            <input id="admin-key" type="password" class="input" autocomplete="off" placeholder="Enter admin key" />
          </div>
        </div>
      </div>
    </section>

    <section class="card" style="margin-top:16px;">
      <div class="card-head"><h2 class="card-title">Add or update a station</h2></div>
      <div class="card-body">
        <form id="station-form" novalidate>
          <div class="form-row">
            <div class="field">
              <label for="st-select">Station to edit</label>
              <select id="st-select" class="select"><option value="">New station</option></select>
            </div>
            <div class="field">
              <label for="st-name">Station name <span style="color:var(--danger);">*</span></label>
              <input id="st-name" type="text" class="input" required placeholder="e.g. Anand Vihar" />
            </div>
          </div>
          <div class="form-row">
            <div class="field"><label for="st-location">Location</label><input id="st-location" type="text" class="input" /></div>
            <div class="field"><label for="st-lat">Latitude</label><input id="st-lat" type="number" step="any" class="input" /></div>
            <div class="field"><label for="st-lon">Longitude</label><input id="st-lon" type="number" step="any" class="input" /></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="st-type">Station type</label><input id="st-type" type="text" class="input" /></div>
            <div class="field">
              <label for="st-status">Status</label>
              <select id="st-status" class="select">
                <option value="">(unchanged)</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
            <div class="field"><label for="st-installed">Installation date</label><input id="st-installed" type="date" class="input" /></div>
          </div>
          <div class="actions">
            <button type="submit" id="st-save" class="btn btn-primary">Save station</button>
            <button type="button" id="st-clear" class="btn btn-secondary">Clear form</button>
          </div>
        </form>
      </div>
    </section>

    <section class="card" style="margin-top:16px;">
      <div class="card-head"><h2 class="card-title">Assign a pollutant to a station</h2></div>
      <div class="card-body">
        <form id="pollutant-form" novalidate>
          <div class="form-row">
            <div class="field">
              <label for="p-station">Station</label>
              <select id="p-station" class="select"><option value="">Select…</option></select>
            </div>
            <div class="field">
              <label for="p-pollutant">Pollutant</label>
              <select id="p-pollutant" class="select">
                <option value="">Select…</option>
                <option>PM2.5</option><option>PM10</option>
                <option>NO2</option><option>SO2</option>
              </select>
            </div>
            <div class="field" style="justify-content:flex-end;">
              <label>&nbsp;</label>
              <button type="submit" id="p-assign" class="btn btn-primary">Assign pollutant</button>
            </div>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">AirTrack · DBMS project, NIT Delhi (CSE)</footer>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
