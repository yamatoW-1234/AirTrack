<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search | AirTrack</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">A</span>
        <span>AirTrack</span>
        <span class="brand-sub">Delhi air quality</span>
      </a>
      <nav class="nav">
        <a href="index.html">Dashboard</a>
        <a href="summary.html">24-Hour Summary</a>
        <a href="search.html">Search</a>
        <a href="reports.html">Reports</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Search and Filter</h1>
        <p class="page-subtitle">Filter raw readings and daily AQI records across all stations.</p>
      </div>
    </div>

    <section class="card" style="margin-bottom:16px;">
      <div class="card-body">
        <div class="form-row">
          <div class="field">
            <label for="f-station">Station</label>
            <select id="f-station" class="select">
              <option value="">All stations</option>
            </select>
          </div>
          <div class="field">
            <label for="f-pollutant">Pollutant <small style="text-transform:none;font-weight:400;color:var(--text-subtle);">(Readings tab)</small></label>
            <select id="f-pollutant" class="select">
              <option value="">All pollutants</option>
              <option>PM2.5</option><option>PM10</option>
              <option>NO2</option><option>O3</option>
              <option>SO2</option><option>CO</option>
              <option>NH3</option>
            </select>
          </div>
          <div class="field">
            <label for="f-category">AQI category <small style="text-transform:none;font-weight:400;color:var(--text-subtle);">(Daily AQI tab)</small></label>
            <select id="f-category" class="select">
              <option value="">All categories</option>
              <option>Good</option>
              <option>Satisfactory</option>
              <option>Moderate</option>
              <option>Poor</option>
              <option>Very Poor</option>
              <option>Severe</option>
            </select>
          </div>
          <div class="field">
            <label for="f-from">From date</label>
            <input id="f-from" type="date" class="input" />
          </div>
          <div class="field">
            <label for="f-to">To date</label>
            <input id="f-to" type="date" class="input" />
          </div>
        </div>
        <div class="actions">
          <button id="btn-search" class="btn btn-primary">Search</button>
          <button id="btn-reset" class="btn btn-secondary">Reset</button>
        </div>
      </div>
    </section>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="readings" role="tab">Readings</button>
      <button class="tab" data-tab="daily" role="tab">Daily AQI Records</button>
    </div>

    <section class="card tab-panel active" data-panel="readings">
      <div class="card-body tight">
        <div id="readings-host">
          <div class="loading"><span class="spinner"></span>Loading…</div>
        </div>
      </div>
    </section>

    <section class="card tab-panel" data-panel="daily">
      <div class="card-body tight">
        <div id="daily-host">
          <div class="loading"><span class="spinner"></span>Loading…</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">AirTrack · DBMS project, NIT Delhi (CSE)</footer>

  <script src="js/app.js"></script>
  <script>
  (function () {
    const AT = window.AirTrack;
    const stationSel = document.getElementById("f-station");
    const pollutantSel = document.getElementById("f-pollutant");
    const categorySel  = document.getElementById("f-category");
    const fromInp = document.getElementById("f-from");
    const toInp   = document.getElementById("f-to");
    const searchBtn = document.getElementById("btn-search");
    const resetBtn  = document.getElementById("btn-reset");
    const readingsHost = document.getElementById("readings-host");
    const dailyHost    = document.getElementById("daily-host");

    const state = {
      readingsPage: 1,
      dailyPage: 1,
      lastReadings: null,
      lastDaily: null,
    };

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
        const key = tab.dataset.tab;
        document.querySelectorAll(".tab-panel").forEach(p => {
          p.classList.toggle("active", p.dataset.panel === key);
        });
      });
    });

    async function loadStations() {
      try {
        const data = await AT.api("/api/stations");
        const list = Array.isArray(data) ? data : (data.stations || []);
        const opts = [`<option value="">All stations</option>`]
          .concat(list.map(s => `<option value="${s.id}">${escapeHtml(s.name || s.id)}</option>`));
        stationSel.innerHTML = opts.join("");
      } catch (e) {
        AT.toast(e.message, "error");
      }
    }

    function buildQuery() {
      const q = {};
      if (stationSel.value)   q.station   = stationSel.value;
      if (pollutantSel.value) q.pollutant = pollutantSel.value;
      if (categorySel.value)  q.category  = categorySel.value;
      if (fromInp.value)      q.from      = fromInp.value;
      if (toInp.value)        q.to        = toInp.value;
      return q;
    }

    function renderReadings(data) {
      const rows = data.rows || [];
      if (!rows.length) {
        readingsHost.innerHTML = `<div class="empty">0 results</div>`;
        return;
      }
      const html = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Station</th><th>Pollutant</th><th>Time</th>
                <th>Concentration</th><th>Sub-index</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td>${escapeHtml(r.stationName || r.stationId || "—")}</td>
                  <td><strong>${escapeHtml(r.pollutant)}</strong></td>
                  <td>${AT.formatDateTime(r.time || r.timestamp)}</td>
                  <td>${AT.fmtNum(r.concentration, 2)} ${escapeHtml(r.unit || "")}</td>
                  <td>${r.subIndex != null ? AT.fmtNum(r.subIndex, 0) : "—"}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
        ${pager(data.page, data.totalPages, data.total)}
      `;
      readingsHost.innerHTML = html;
      bindPager(readingsHost, "readings");
    }

    function renderDaily(data) {
      const rows = data.rows || [];
      if (!rows.length) {
        dailyHost.innerHTML = `<div class="empty">0 results</div>`;
        return;
      }
      const html = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th><th>Station</th><th>AQI</th>
                <th>Category</th><th>Dominant pollutant</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td>${AT.formatDate(r.date)}</td>
                  <td>${escapeHtml(r.stationName || r.stationId || "—")}</td>
                  <td><strong>${r.aqi ?? "—"}</strong></td>
                  <td>${AT.aqiBadge(r.aqi)}</td>
                  <td>${escapeHtml(r.dominantPollutant || "—")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
        ${pager(data.page, data.totalPages, data.total)}
      `;
      dailyHost.innerHTML = html;
      bindPager(dailyHost, "daily");
    }

    function pager(page, totalPages, total) {
      const p = Number(page) || 1;
      const tp = Number(totalPages) || 1;
      return `
        <div class="pager">
          <div>Page ${p} of ${tp} · ${total ?? "—"} results</div>
          <div class="actions">
            <button class="btn btn-secondary btn-sm" data-pager="prev" ${p <= 1 ? "disabled" : ""}>Previous</button>
            <button class="btn btn-secondary btn-sm" data-pager="next" ${p >= tp ? "disabled" : ""}>Next</button>
          </div>
        </div>
      `;
    }

    function bindPager(host, kind) {
      host.querySelectorAll("[data-pager]").forEach(btn => {
        btn.addEventListener("click", () => {
          if (kind === "readings") {
            state.readingsPage += (btn.dataset.pager === "next" ? 1 : -1);
            fetchReadings();
          } else {
            state.dailyPage += (btn.dataset.pager === "next" ? 1 : -1);
            fetchDaily();
          }
        });
      });
    }

    async function fetchReadings() {
      readingsHost.innerHTML = `<div class="loading"><span class="spinner"></span>Loading…</div>`;
      try {
        const q = { ...buildQuery(), page: state.readingsPage, pageSize: AT.PAGE_SIZE };
        delete q.category;
        const data = await AT.api("/api/readings", { query: q });
        state.lastReadings = data;
        renderReadings(data);
      } catch (e) {
        readingsHost.innerHTML = `<div class="empty">Failed to load readings.</div>`;
        AT.toast(e.message, "error");
      }
    }

    async function fetchDaily() {
      dailyHost.innerHTML = `<div class="loading"><span class="spinner"></span>Loading…</div>`;
      try {
        const q = { ...buildQuery(), page: state.dailyPage, pageSize: AT.PAGE_SIZE };
        delete q.pollutant;
        const data = await AT.api("/api/daily-records", { query: q });
        state.lastDaily = data;
        renderDaily(data);
      } catch (e) {
        dailyHost.innerHTML = `<div class="empty">Failed to load daily records.</div>`;
        AT.toast(e.message, "error");
      }
    }

    function reset() {
      stationSel.value = "";
      pollutantSel.value = "";
      categorySel.value = "";
      fromInp.value = "";
      toInp.value = "";
      state.readingsPage = 1;
      state.dailyPage = 1;
      fetchReadings();
      fetchDaily();
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    searchBtn.addEventListener("click", () => {
      state.readingsPage = 1;
      state.dailyPage = 1;
      fetchReadings();
      fetchDaily();
    });
    resetBtn.addEventListener("click", reset);

    loadStations().then(() => { fetchReadings(); fetchDaily(); });
  })();
  </script>
  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/common.js"></script><script src="js/search.js"></script>
</body>
</html>
